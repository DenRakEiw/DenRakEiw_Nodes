[project]
# Immutable once published: this is the node's permanent registry id.
name = "denrakeiw-nodes"
description = "Mixed ComfyUI pack: Flux LayerDiffuse transparency, Flux 3 video API nodes, universal NN latent upscalers, image-sequence loading and a conditioning inspector."
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["diffusers==0.32.2", "transformers>=4.48.0,<5.0.0", "safetensors>=0.5.0", "accelerate>=1.5.0", "peft", "Pillow>=8.0.0,<12.0.0", "opencv-python", "numpy>=1.19.0,<3.0.0", "tqdm", "protobuf", "sentencepiece", "pytz", "kornia>=0.6.0", "color-matcher>=0.2.0"]

[project.urls]
Repository = "https://github.com/DenRakEiw/DenRakEiw_Nodes"
"Bug Tracker" = "https://github.com/DenRakEiw/DenRakEiw_Nodes/issues"

[tool.comfy]
PublisherId = "denrakeiw"
DisplayName = "DenRakEiw Nodes"
